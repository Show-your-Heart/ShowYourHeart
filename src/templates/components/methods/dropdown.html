<c-methods.base-field>
    <div class="flex gap-4">
        <select :id="`question_${instanceId}`" :name="`question_${instanceId}`"
            class="bg-gray-50 cursor-pointer border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full max-w-100 p-2.5 disabled:bg-gray-100 disabled:cursor-default"
            :class="state.hasErrors ? 'border-red-600' : 'border-gray-300'"
            :class="!isDirectIndicator ? 'pointer-events-none' : ''"
            {% include "django/forms/widgets/attrs.html" %} x-bind:disabled="state.notApplicable"
            @change="update($event.target.value)"
        >
            <template x-if="$store.indicators.indicators[instanceId].value.value === null">
                <option disabled selected value> -- </option>
            </template>
            {% for group, options, index in widget.optgroups %}
                {% for option in options %}
                    <option value="{{ option.value.id }}"
                        :selected="isOptionSelected('{{option.value.id}}')">
                        {{ option.label }}
                    </option>
                {% endfor %}
            {% endfor %}
        </select> <span class="flex items-center" x-text="unit"></span>
    </div>
    <div class="text-red-600" x-show="state.hasErrors">
        <p x-text="state.error"></p>
    </div>
</c-methods.base-field>
