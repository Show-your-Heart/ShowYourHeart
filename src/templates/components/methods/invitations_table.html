{% load i18n %}



 <table id="invitations-table"  class="w-full border border-gray-300 border-collapse text-sm">
    <thead class="bg-gray-100">
        <tr>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Name" %}</th>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Email" %}</th>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Date" %}</th>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Status" %}</th>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Send" %}</th>
            <th class="border border-gray-300 px-4 py-2 text-left">{% translate "Delete" %}</th>
        </tr>
    </thead>
    <tbody id="invitation-table-body">
        {% for invitation in invitations %}
            <tr id="invitation-row-{{ invitation.id }}" class="odd:bg-white even:bg-gray-50">
                <c-methods.invitation-row :invitation="invitation"> </c-methods.invitation-row >
            </tr>
        {% empty %}
             <tr id="empty-row">
                <td colspan="6" class="border border-gray-300 px-4 py-4 text-center text-gray-500">
                    {% translate "No invitations found." %}
                </td>
            </tr>
        {% endfor %}
     
        <tr id="imported-rows">
            <c-methods.invitations-imported-rows :invitationsImported="invitationsImported"> </c-methods.invitations-imported-rows>
        </tr> 
      
    </tbody>
</table>
