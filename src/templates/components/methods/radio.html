<c-methods.base-field>
    <div class="flex flex-col space-y-2 pl-4" :id="`question_${instanceId}`">
        {% for group, options, index in widget.optgroups %}
        {% for option in options %}
        <label :for="`question_${instanceId}_option_{{index}}`"
            class="inline-flex items-center cursor-pointer mr-4 has-disabled:cursor-default has-disabled:pointer-events-none"
            @click="update('{{ option.value.id }}')" :class="!isDirectIndicator ? 'cursor-default pointer-events-none' : ''">
            <input type="radio" :id="`question_${instanceId}_option_{{index}}`" :name="`question_${instanceId}`"
                value="{{ option.value.id }}"
                class="pointer-events-none h-4 w-4 text-blue-600 bg-gray-100 border-gray-300 cursor-pointer focus:ring-blue-500 disabled:cursor-default peer"
                :checked="isOptionSelected('{{option.value.id}}')" 
                {% include "django/forms/widgets/attrs.html" %} x-bind:disabled="state.notApplicable" :readonly="!isDirectIndicator"
            >
            <span class="ml-2 text-sm text-gray-700 peer-disabled:text-gray-400 peer-disabled:cursor-default">
                {{ option.label }} <span class="items-center" x-text="unit"></span>
            </span>
        </label>
        {% endfor %}
        {% endfor %}
    </div>
</c-methods.base-field>
