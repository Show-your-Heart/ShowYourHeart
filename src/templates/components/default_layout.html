{% load i18n static active_link_tags extra_settings django_htmx %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'styles/output.css' %}">
  <title> ShowYourHeart | {{ pageTitle }}</title>
  {% htmx_script %}
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  {{ extra_head_js }}
</head>

<body class="bg-gray-50 mx-auto relative">
  <c-header displayAvatar="true"/>

  <div class="flex gap-2 mt-0 pt-0 p-2 items-stretch">
    <aside>
      {{ sidebar }}
    </aside>

    <main class="mx-auto w-full max-w-screen-lg p-4">
        {{ slot }}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  {{ extra_js }}
</body>

</html>
