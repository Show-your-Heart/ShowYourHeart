{% load i18n %}

<div>
    <button type="button" data-drawer-target="drawer-{{id}}" data-drawer-show="drawer-{{id}}" data-drawer-placement="right" aria-controls="drawer-{{id}}">
        <c-icon icon="info-circle" class="rounded-full text-white bg-pink-600 hover:text-pink-600 hover:bg-white hover:cursor-pointer focus:ring-4 focus:outline-none focus:ring-pink-300"></c-icon>
    </button>
    <div id="drawer-{{id}}" tabindex="-1" aria-labelledby="help-drawer" class="fixed top-0 right-0 z-40 h-screen p-4 overflow-y-auto transition-transform translate-x-full bg-white w-80">
        <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-gray-200"> 
            <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                {% translate "Aclaración" %}
            </h3>
            <button type="button" data-drawer-hide="drawer-{{id}}" class="bg-transparent hover:cursor-pointer hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
                <c-icon icon="close" class="text-gray-700"></c-icon>
                <span class="sr-only">{% translate "Close drawer" %}</span>
            </button>
        </div>
        <!-- Modal body -->
        <div class="p-4 md:p-5 space-y-4">
            {{ msg }}
        </div>
    </div>
</div>
