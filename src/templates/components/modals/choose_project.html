{% load i18n %}

<div
  x-show="open"
  x-transition.opacity.duration.200ms
  class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40"
></div>

<div
  x-show="open"
  x-transition.scale.opacity.duration.200ms
  class="fixed inset-0 z-50 flex items-center justify-center"
  @click.outside="open = false"
>
  <div class="relative bg-white p-6 rounded-xl shadow-xl border border-gray-200 w-96">

    <!-- Close button -->
    <button
      @click="open = false"
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition"
      aria-label="Close"
    >
      &times;
    </button>

    <h2 class="text-lg font-semibold mb-4">Project Selection</h2>

    <h1 class="text-xl font-bold">Choose existing project</h1>
    <p>Your project list goes here...</p>

    <div x-data="{ open: false }"
        x-init="$watch('open', value => document.body.classList.toggle('overflow-hidden', value))">
            <a class="h-fit-content" href="#" @click.prevent="open = true">
              <c-button>
                <span>{% translate 'Create project' %}</span>
                <c-icon icon="arrow-right" class="inline text-white"></c-icon>
              </c-button>
            </a>
        {% include "components/modals/create_project.html" %}
    </div>

    <button class="mt-4 bg-gray-700 text-white px-3 py-1 rounded" @click="open = false">
      Close
    </button>
  </div>
</div>
