{% load i18n %}

<div
  x-show="open"
  x-transition.opacity.duration.200ms
  class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40"
></div>

<div
  x-show="open"
  x-data="{
    baseUrl: 'methods/{{surveyStats.method.id}}/fill/',
    selectedProjectUrl: '',
    setSelectedProjectId(id){
      this.selectedProjectUrl = this.baseUrl + id
    }
  }"
  x-transition.scale.opacity.duration.200ms
  class="fixed inset-0 z-50 flex items-center justify-center"
  @click.outside="open = false"
>
  <div class="relative bg-white p-8 rounded-lg shadow-sm border border-gray-200 w-96">

    <!-- Close button -->
    <button
      @click="open = false"
      class="absolute top-3 right-0 p-4 text-gray-400 hover:text-gray-600 transition"
      aria-label="Close"
    >
      &times;
    </button>

    <h1 class="text-lg font-semibold p-2">Project Selection</h1>
    <div class="p-2">
      {{ choose_project_form }}
    </div>
    <div class="p-2">
      <a class="h-fit-content" :href="selectedProjectUrl">
        <c-button>
          <span>{% translate 'Ir al balance'%}</span>
          <c-icon name="arrow-right" class="inline text-white"></c-icon>
        </c-button>
      </a>
    </div>
    <div class="p-2">
      <a class="h-fit-content" href="{% url 'organizations:create_project' organization.id %}">
        <c-button>
          <span>{% translate 'Create project' %}</span>
          <c-icon name="arrow-right" class="inline text-white"></c-icon>
        </c-button>
      </a>
    </div>

  </div>
</div>
