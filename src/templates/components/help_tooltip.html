{% load i18n %}

<div>
    <button type="button" data-modal-target="modal-{{id}}" data-modal-toggle="modal-{{id}}">
        <c-icon icon="info-circle" class="rounded-full text-blue-700 hover:text-blue-800 hover:cursor-pointer focus:ring-4 focus:outline-none focus:ring-blue-300"></c-icon>
    </button>
    <!-- Main modal -->
    <div id="modal-{{id}}" data-modal-backdrop="static" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-2xl max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-gray-200">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                        {% translate "Aclaración" %}
                    </h3>
                    <button type="button" class="bg-transparent hover:cursor-pointer hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center " data-modal-hide="modal-{{id}}">
                        <c-icon icon="close" class="text-gray-700"></c-icon>
                        <span class="sr-only">{% translate "Close modal" %}</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="p-4 md:p-5 space-y-4">
                    {{ msg }}
                </div>
            </div>
        </div>
    </div>
</div>
