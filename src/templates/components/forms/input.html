{% load i18n static %}

<script src="{% static 'js/field.js' %}"></script>

<div x-data="field('{{widget.attrs.code}}')"  :id="`field-${id}`" class="flex flex-col" x-show="show" x-transition x-transition.delay.200ms>
    <div class="flex gap-4">
        <label :for="id" class="block mb-2 text-md font-medium text-gray-900 dark:text-white">
            <span class="mr-3 px-2 py-1 text-xs font-bold rounded-sm bg-pink-100" x-text="code"></span> 
            <span x-text="name"></span>
        </label>
        <c-help-drawer msg="{{widget.attrs.msg}}" id="{{widget.attrs.id}}"></c-help-drawer>
    </div>
    <input 
        :id="id" 
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full max-w-100 p-2.5" 
        :name="id" 
        :value="value"
        {% comment %} {% if widget.value != None %} 
            value="{{ widget.value|stringformat:'s' }}"
        {% endif %}  {% endcomment %}
        type="{{ widget.type}}" 
        placeholder="{{placeholder}}" 
        required="{{required}}" 
        {% include "django/forms/widgets/attrs.html" %}
        @blur="update($event)" 
        :disabled="!isDirectIndicator"
    />
    <div class="text-red-600" x-show="hasErrors">
        <p x-text="error"></p>
    </div>
</div>
