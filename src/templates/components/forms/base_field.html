{% load i18n static%}

<div x-data="field('{{widget.attrs.code}}')" :id="`field-${id}`" class="flex flex-col" x-show="show" x-transition
    x-transition.delay.200ms>

    <div class="flex gap-4 mb-1">
        <div class="w-full grid grid-cols-2 gap-4">
            <label :for="`question_${id}`" class="block mb-2 text-md font-medium text-gray-900">
                <span class="mr-3 px-2 py-1 text-xs font-bold rounded-sm bg-pink-100" x-text="code"></span>
                <span x-text="name"></span>
            </label>

            <div x-show="mandatory" class="flex items-center">
                <input type="checkbox" id="{{ widget.name }}_na" name="{{ widget.name }}_na" value="True" class="cursor-pointer h-4 w-4 text-blue-600 bg-gray-100 border-gray-300 rounded
                        focus:ring-blue-500" x-model="notApplicable" {% include "django/forms/widgets/attrs.html" %}>
                <label for="{{ widget.name }}_na" class="cursor-pointer ml-2 text-sm text-gray-700"> {% translate 'Not
                    applicable'
                    %}</label>
            </div>
        </div>

        {% comment %} Here we use the widget object to fill data into Cotton fields since Alpine and Cotton would
        clash in the use of dynamic fields {% endcomment %}
        {% if widget.attrs.description %}
        <c-help-drawer msg="{{widget.attrs.description}}" id="{{widget.attrs.id}}"></c-help-drawer>
        {% endif %}
    </div>

    {{ slot }}

</div>
