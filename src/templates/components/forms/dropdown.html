<c-forms.base-field>
    <div class="flex gap-4">
        <select :id="id" :name="`question_${id}`"
            class="bg-gray-50 cursor-pointer border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full max-w-100 p-2.5"
            :required="required" {% include "django/forms/widgets/attrs.html" %}>
            {% for group, options, index in widget.optgroups %}
            {% for option in options %}
            <option value="{{ option.value.value }}" :selected="value.includes(String({{ option.value.value }}))"
                @click="update($event)">
                {{ option.label }}
            </option>
            {% endfor %}
            {% endfor %}
        </select> <span class="flex items-center" x-text="unit"></span>
    </div>
</c-forms.base-field>
