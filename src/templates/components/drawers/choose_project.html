{% load i18n %}

<c-drawers.base 
  title="{% translate 'Project selection' %}" 
  target="drawer-choose-project"
  width="sm"
  x-data="{
    selectedProjectUrl: '',
    setSelectedProjectId(id) {
      this.selectedProjectUrl = 'methods/fill/' + campaignId + '/' + selectedMethod + '/' + id
    },
    selectedMethodUrl: '',
    setSelectedMethodId() {
      this.selectedMethodUrl = 'methods/external-surveys/' + organizationId + '/' + selectedMethod
    }
  }"
>
  <div class="p-2">
    {{ choose_project_form }}
  </div>
  <div class="p-2 flex space-x-2">
    <a class="h-fit-content" :href="selectedProjectUrl">
      <c-button>
        <span>{% translate 'Go to balance'%}</span>
        <c-icon name="arrow-right" class="inline text-white"></c-icon>
      </c-button>
    </a>
    {% if selectedMethod.external_surveys.exists %}
    <a class="h-fit-content" :href="selectedMethodUrl">
      <c-button name="action" value="send_external_surveys">
        {% translate 'Send external surveys' %}
      </c-button>
    </a>
    {% endif %}
    <c-button data-drawer-target="drawer-create-project" data-drawer-placement="right" data-drawer-show="drawer-create-project" aria-controls="drawer-create-project">
      <span>{% translate 'Create project' %}</span>
      <c-icon name="arrow-right" class="inline text-white"></c-icon>
    </c-button>
  </div>
</c-drawers.base>
