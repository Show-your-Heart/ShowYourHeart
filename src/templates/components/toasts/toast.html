<div
    class="relative"
    x-show="$store.notifications.visible.includes(notification)"
    x-transition:enter="transition ease-in duration-300"
    x-transition:enter-start="transform opacity-0 -translate-y-2"
    x-transition:enter-end="transform opacity-100"
    x-transition:leave="transition ease-out duration-500"
    x-transition:leave-start="transform translate-x-0 opacity-100"
    x-transition:leave-end="transform translate-x-full opacity-0"
    @click="$store.notifications.remove(notification.id)"
    style="pointer-events:all"
>
    <div class="flex items-start space-x-2 max-w-[500px] sm:items-center p-4 text-sm rounded-lg border " 
        role="alert"
        :class="notification.type == 'success' ? 'text-green-700 bg-green-200 border-green-700' : notification.type == 'warning' ? 'text-yellow-700 bg-yellow-200 border-yellow-700' : 'text-red-700 bg-red-200 border-red-700'"
    >
        <div class="self-start">
            <template x-if="notification.type == 'warning'">
                <c-icon  name="info-circle"></c-icon>
            </template>

            <template x-if="notification.type == 'success'">
                <c-icon name="check"></c-icon>
            </template>
            
            <template x-if="notification.type == 'error'">
                <c-icon name="close"></c-icon>
            </template>
        </div>
        <p x-text="notification.text"></p>
    </div>
    <div
        x-cloak
        :class="notification.type == 'success' ? 'bg-green-300' : notification.type == 'warning' ? 'bg-yellow-300' : 'bg-red-300'"
        class="absolute bottom-0 left-0 right-0 w-full rounded-b-lg">
        <div
            class="h-2 w-0 progress rounded-b-lg opacity-[20%]"
            :class="notification.type == 'success' ? 'bg-green-400' : notification.type == 'warning' ? 'bg-yellow-400' : 'bg-red-400'"
            :style="`animation-duration:${notification.animationTime}ms`">
        </div>
    </div>
</div>
